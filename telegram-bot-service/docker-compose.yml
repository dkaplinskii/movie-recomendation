services:
  postgres:
    image: postgres:16-alpine
    container_name: bot_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_NAME: ${POSTGRES_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: bot_app
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  pgdata: