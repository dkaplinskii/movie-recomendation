basePath: /
host: localhost:80
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API Gateway for Movie Recommendation Platform
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: API Gateway
  version: "1.0"
paths:
  /health:
    get:
      description: Check if the service is alive
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Health check
      tags:
      - System
  /test:
    get:
      description: Simple test endpoint
      produces:
      - text/plain
      responses:
        "200":
          description: test ok
          schema:
            type: string
      summary: Test endpoint
      tags:
      - System
swagger: "2.0"
