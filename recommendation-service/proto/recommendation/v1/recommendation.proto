syntax = "proto3";

package recommendation.v1;

option go_package = "pkg/recommendation/v1;recommendationv1";

service RecommendationService {
  rpc GetMovieRecommendation(GetMovieRecommendationRequest)
      returns (GetMovieRecommendationResponse);
}

message GetMovieRecommendationRequest {
  int64 user_id = 1;
}

message GetMovieRecommendationResponse {
  repeated MovieRecommendation movies = 1;
}

message MovieRecommendation {
  int64 id = 1;
  string title = 2;
  string description = 3;
  repeated string genres = 4;
  string poster_url = 5;
  int32 year = 6;
  string country = 7;
  string trailer_url = 8;
}